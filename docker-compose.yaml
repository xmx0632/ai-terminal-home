# Define common configuration for the service
x-ai-terminal-common: &ai-terminal-common
  container_name: ai-terminal-home
  network_mode: host
  tty: true
  stdin_open: true
  extra_hosts:
    - "host.docker.internal:host-gateway"
  # 启动命令示例:
  # HOST=0.0.0.0 PORT=56041 npx vibe-kanban &
  # claude --dangerously-skip-permissions
  env_file:
    - .env
  # 安全设置：容器隔离确保宿主机安全
  security_opt:
    - no-new-privileges:true
  # 限制容器权限
  cap_drop:
    - ALL
  # Run as non-root user (uncomment if your image supports it)
  # user: "${UID:-1000}:${GID:-1000}"
  volumes:
    - ./data:/data
    - /etc/localtime:/etc/localtime:ro
    - /etc/timezone:/etc/timezone:ro
    # 持久化 Claude Code 配置（挂载本地目录，避免每次重新认证）
    - ./.claude:/root/.claude
  working_dir: /data
  restart: unless-stopped

services:
  # Default profile: build from source
  ai-terminal-home:
    <<: *ai-terminal-common
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["build"]

  # Pull from Docker Hub
  ai-terminal-home-pull:
    <<: *ai-terminal-common
    image: xmx0632/ai-terminal-home:${VERSION:-latest}
    # 优先使用本地镜像
    pull_policy: if_not_present
    profiles: ["pull"]
